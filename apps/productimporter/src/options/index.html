<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ZetSales Product Importer — Settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; max-width: 360px; margin: 24px auto; color: #0f172a; }
    h1 { font-size: 16px; margin-bottom: 4px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 12px; font-size: 12px; color: #b91c1c; min-height: 14px; }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <h1>ZetSales Product Importer</h1>

  <div id="loggedOut">
    <p>Log in with your ZetSales account to enable importing.</p>
    <label>Email <input id="email" type="email" autocomplete="username" /></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" /></label>
    <details>
      <summary>Advanced: server URLs</summary>
      <label>API base URL <input id="apiBaseUrl" value="https://zetsales.com/api/v1" /></label>
      <label>App base URL <input id="appBaseUrl" value="https://zetsales.com" /></label>
    </details>
    <button id="loginButton" type="button">Log in</button>
    <div id="status"></div>
  </div>

  <div id="loggedIn" style="display:none">
    <p>Logged in as <b id="loggedInEmail"></b>.</p>
    <button id="logoutButton" type="button">Log out</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
