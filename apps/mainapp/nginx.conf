server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build output (index-<hash>.js/.css) is safe to cache forever — a new deploy always
  # ships a new filename, so there's nothing to invalidate.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html references the current hashed asset filenames, so it must never be served stale —
  # without this, a browser that caches it (nginx sends no Cache-Control by default, and browsers
  # apply their own heuristic freshness in that case) keeps loading the OLD bundle after a deploy,
  # even though the new one is live on the server the whole time.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
