services:
  mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000,http://149.28.135.115:3000}
    working_dir: /app/services/auth-service
    ports:
      - "3011:3001"
    restart: unless-stopped

  commerce-service:
    build:
      context: .
      dockerfile: services/commerce-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3002"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      STORE_CREDENTIALS_SECRET: ${STORE_CREDENTIALS_SECRET:-dev-store-credentials-secret-change-me}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-dev-shopify-webhook-secret}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:-dev-woocommerce-webhook-secret}
      PATHAO_SANDBOX: ${PATHAO_SANDBOX:-true}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_COMMERCE_URL: ${PUBLIC_COMMERCE_URL:-http://localhost:8081/api/v1/commerce}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000,http://149.28.135.115:3000}
      UPLOAD_DIR: /app/uploads
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
    working_dir: /app/services/commerce-service
    ports:
      - "3012:3002"
    volumes:
      - commerce_uploads:/app/uploads
    restart: unless-stopped

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3003"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      MESSAGING_CREDENTIALS_SECRET: ${MESSAGING_CREDENTIALS_SECRET:-dev-messaging-credentials-secret-change-me}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-dev-meta-webhook-verify-token}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PUBLIC_MESSAGING_URL: ${PUBLIC_MESSAGING_URL:-http://localhost:8081/api/v1/messaging}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000,http://149.28.135.115:3000}
      MESSAGING_UPLOAD_DIR: /app/uploads
    working_dir: /app/services/messaging-service
    ports:
      - "3013:3003"
    volumes:
      - messaging_uploads:/app/uploads
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:3001
      COMMERCE_SERVICE_URL: http://commerce-service:3002
      MESSAGING_SERVICE_URL: http://messaging-service:3003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://149.28.135.115:3000}
    ports:
      - "8081:8080"
    depends_on:
      - auth-service
      - commerce-service
      - messaging-service
    restart: unless-stopped

  mainapp:
    build:
      context: .
      dockerfile: apps/mainapp/Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mainapp
    restart: unless-stopped

volumes:
  mongo_data:
  commerce_uploads:
  messaging_uploads:
  caddy_data:
  caddy_config:
